<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucy Hotel</title>
    <script>
      (function() {
        function showError(msg, type) {
          var d = document.getElementById("mobile-debug-err");
          if (!d) {
            d = document.createElement("div");
            d.id = "mobile-debug-err";
            d.style = "position:fixed;top:0;left:0;width:100%;max-height:50vh;overflow-y:auto;background:#E11D48;color:white;padding:15px;z-index:999999;font-family:monospace;font-size:12px;word-break:break-all;border-bottom:3px solid #9F1239;";
            document.documentElement.appendChild(d);
          }
          d.innerHTML += "<div><strong>[" + type + "]:</strong> " + msg + "</div><hr style='border-color:#F43F5E;margin:5px 0;'>";
        }
        window.addEventListener("error", function(e) {
          showError(e.message + " at " + e.filename + ":" + e.lineno, "RUNTIME");
        });
        window.addEventListener("unhandledrejection", function(e) {
          showError(e.reason, "PROMISE");
        });
        var oldError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          showError(args.join(" "), "REACT/CONSOLE");
          oldError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body class="bg-[#11141A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
